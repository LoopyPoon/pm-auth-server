spring:
  application:
    name: pm-auth-service
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

server:
  port: 8081

logging:
  level:
    org.springframework.security: info