<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — PoorMusic</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
            background: #0a0a1a;
            overflow: hidden;
        }

        /* Анимированный синий градиент — как на фронте */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background: linear-gradient(
                135deg,
                #0a0a1a 0%,
                #1a1a2e 25%,
                #16213e 50%,
                #1a1a2e 75%,
                #0a0a1a 100%
            );
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: #121212;
            border-radius: 12px;
            padding: 40px 36px;
            text-align: center;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 14px;
            color: #a7a7a7;
            margin-bottom: 28px;
        }

        .error {
            padding: 10px 14px;
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.25);
            border-radius: 8px;
            color: #e74c3c;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }

        .field {
            margin-bottom: 14px;
            text-align: left;
        }

        .label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            background: #282828;
            border: 1px solid transparent;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .input::placeholder { color: #6a6a6a; }
        .input:focus { border-color: #1ed760; background: #333; }
        .input:hover:not(:focus) { border-color: rgba(255,255,255,0.15); }

        .password-wrapper { position: relative; }
        .password-wrapper .input { padding-right: 44px; }

        .eye-btn {
            position: absolute;
            right: 4px; top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            background: transparent; border: none;
            color: #6a6a6a; font-size: 18px;
            cursor: pointer; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.2s;
        }
        .eye-btn:hover { color: #fff; }

        .submit-btn {
            width: 100%;
            height: 48px;
            background: #1ed760;
            color: #000;
            border: none;
            border-radius: 500px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 8px;
        }
        .submit-btn:hover { transform: scale(1.02); background: #1fdf64; }
        .submit-btn:active { transform: scale(0.98); }

        .divider {
            display: flex; align-items: center; gap: 12px;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #282828;
        }
        .divider span { font-size: 12px; color: #6a6a6a; text-transform: uppercase; }

        .footer-row {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; font-size: 14px; color: #a7a7a7;
        }
        .footer-row a {
            color: #fff; font-weight: 600;
            text-decoration: underline; text-underline-offset: 2px;
            transition: color 0.2s;
        }
        .footer-row a:hover { color: #1ed760; }

        .page-footer {
            position: relative;
            z-index: 1;
            margin-top: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            .title { font-size: 24px; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1 class="title">Войти в аккаунт</h1>
    <p class="subtitle">Продолжить в PoorMusic</p>

    <div id="error-block" class="error" style="display: none;">
        Неверный email/имя пользователя или пароль
    </div>

    <form method="post" action="/login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="field">
            <label class="label" for="username">Email или имя пользователя</label>
            <input id="username" name="username" type="text" class="input"
                   placeholder="email@example.com" required autofocus autocomplete="username" />
        </div>

        <div class="field">
            <label class="label" for="password">Пароль</label>
            <div class="password-wrapper">
                <input id="password" name="password" type="password" class="input"
                       placeholder="Введите пароль" required autocomplete="current-password" />
                <button type="button" class="eye-btn" onclick="togglePassword()" id="eyeBtn">👁</button>
            </div>
        </div>

        <button type="submit" class="submit-btn">Войти</button>
    </form>

    <div class="divider"><span>или</span></div>

    <div class="footer-row">
        <span>Нет аккаунта?</span>
        <a href="http://localhost:5173/register">Зарегистрироваться</a>
    </div>
</div>

<div class="page-footer">© 2025 PoorMusic</div>

<script>
    if (window.location.search.includes('error')) {
        document.getElementById('error-block').style.display = 'block';
    }
    function togglePassword() {
        var input = document.getElementById('password');
        var btn = document.getElementById('eyeBtn');
        if (input.type === 'password') { input.type = 'text'; btn.textContent = '🔒'; }
        else { input.type = 'password'; btn.textContent = '👁'; }
    }
</script>
</body>
</html>
